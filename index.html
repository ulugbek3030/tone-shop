<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="TONE — интернет-магазин музыкальных инструментов с доставкой по всему Узбекистану. Демонстрационный шаблон.">
<meta property="og:title" content="TONE — музыкальные инструменты">
<meta property="og:description" content="Увидеть и услышать больше, чем расскажет продавец. Фото, демо звука, характеристики, отзывы.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffa41c'/%3E%3Ctext x='16' y='23' font-family='Inter,Arial' font-weight='800' font-size='20' text-anchor='middle' fill='%230f1111'%3ET%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>TONE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
--bg:#ffffff; --page:#f5f6f8; --surface:#ffffff; --surface2:#f3f4f6; --line:#e5e7eb; --line2:#d1d5db;
--ink:#111827; --ink2:#4b5563; --ink3:#9ca3af; --link:#2563eb;
--cta:#111827; --cta-b:#111827; --cta-ink:#ffffff; --cta2:#2563eb; --cta2-b:#1d4ed8; --accent:#2563eb; --accent-soft:#e8efff;
--star:#f59e0b; --good:#15803d; --good-soft:#e8f5e9; --red:#dc2626; --bad:#dc2626;
--nav:#ffffff; --nav2:#f8f9fb; --nav-ink:#111827; --nav-ink2:#6b7280;
--shadow:0 2px 8px rgba(15,17,17,.08); --shadow2:0 8px 24px rgba(15,17,17,.14);
--panel-g1:#f7f8f8; --panel-g2:#eceff1; --panel-ink:#37474f;
--r:8px; --r2:12px;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
color-scheme:dark;
--bg:#0f1214; --page:#131619; --surface:#1a1e22; --surface2:#22272c; --line:#2c3238; --line2:#3a414a;
--ink:#f3f4f6; --ink2:#b8bec8; --ink3:#7c8391; --link:#7cb0ff;
--cta:#f9fafb; --cta-b:#f9fafb; --cta-ink:#111827; --cta2:#3b82f6; --cta2-b:#2563eb; --accent:#60a5fa; --accent-soft:#1e2a44;
--star:#fbbf24; --good:#4ade80; --good-soft:#14532d; --red:#f87171; --bad:#f87171;
--nav:#111417; --nav2:#171b1f; --nav-ink:#f3f4f6; --nav-ink2:#9ca3af;
--shadow:0 2px 8px rgba(0,0,0,.4); --shadow2:0 8px 24px rgba(0,0,0,.5);
--panel-g1:#23272a; --panel-g2:#2d3236; --panel-ink:#cfd8dc;
}
}
:root[data-theme="dark"]{
color-scheme:dark;
--bg:#0f1214; --page:#131619; --surface:#1a1e22; --surface2:#22272c; --line:#2c3238; --line2:#3a414a;
--ink:#f3f4f6; --ink2:#b8bec8; --ink3:#7c8391; --link:#7cb0ff;
--cta:#f9fafb; --cta-b:#f9fafb; --cta-ink:#111827; --cta2:#3b82f6; --cta2-b:#2563eb; --accent:#60a5fa; --accent-soft:#1e2a44;
--star:#fbbf24; --good:#4ade80; --good-soft:#14532d; --red:#f87171; --bad:#f87171;
--nav:#111417; --nav2:#171b1f; --nav-ink:#f3f4f6; --nav-ink2:#9ca3af;
--shadow:0 2px 8px rgba(0,0,0,.4); --shadow2:0 8px 24px rgba(0,0,0,.5);
--panel-g1:#23272a; --panel-g2:#2d3236; --panel-ink:#cfd8dc;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--link)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{max-width:1360px;margin:0 auto;padding-inline:20px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.link{color:var(--link);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.link:hover{text-decoration:underline}
/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--nav-ink);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:9px;background:none;border:0;padding:6px 6px;border-radius:10px;color:var(--nav-ink)}
.logo:hover{background:var(--surface2)}
.logo .mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px}
.logo .name{font-weight:800;font-size:21px;letter-spacing:.18em}
.loc{display:flex;flex-direction:column;line-height:1.15;padding:6px 10px;border-radius:10px;font-size:11.5px;color:var(--nav-ink2);white-space:nowrap}
.loc b{color:var(--nav-ink);font-size:13px;font-weight:600}
.loc:hover{background:var(--surface2)}
.search{flex:1;display:flex;align-items:stretch;background:var(--surface2);border:1px solid transparent;border-radius:999px;height:44px;min-width:0;transition:border-color .12s,background .12s}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search select{border:0;border-right:1px solid var(--line2);border-radius:0;background:transparent;color:var(--ink2);padding:0 8px 0 16px;font-size:12.5px;max-width:140px}
.search > input{border:0;background:transparent;color:var(--ink);padding:0 14px;flex:1;min-width:0;border-radius:0}
.search > input:focus{outline:none}
.search > input::placeholder{color:var(--ink3)}
.search > button{border:0;background:transparent;width:46px;display:grid;place-items:center;color:var(--ink2)}
.search > button:hover{color:var(--accent)}
.search svg{width:20px;height:20px}
.acct{display:flex;flex-direction:column;line-height:1.15;padding:6px 10px;border-radius:10px;font-size:11.5px;color:var(--nav-ink2);white-space:nowrap;background:none;border:0;text-align:left}
.acct b{color:var(--nav-ink);font-size:13px;font-weight:600}
.acct:hover{background:var(--surface2)}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:0 16px 0 12px;height:42px;font-weight:600;position:relative}
.cartbtn:hover{filter:brightness(1.15)}
.cartbtn svg{width:22px;height:22px}
.cartbtn .cnt{background:var(--accent);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.theme{background:none;border:0;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--nav-ink2)}
.theme:hover{background:var(--surface2)}
.theme svg{width:18px;height:18px}
.subnav{background:var(--nav);color:var(--nav-ink);border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;gap:6px;height:46px;align-items:center;overflow-x:auto;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav button{background:none;border:1px solid transparent;color:var(--ink2);padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap}
.subnav button:hover{background:var(--surface2);color:var(--ink)}
.subnav button.on{background:var(--ink);color:var(--bg)}
.subnav .sep{width:1px;height:20px;background:var(--line2);margin:0 6px}
/* ---------- custom dropdowns ---------- */
.dd{position:relative;display:inline-block;min-width:0}
.dd-btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:0 12px 0 14px;height:38px;font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;max-width:100%;transition:border-color .12s,box-shadow .12s}
.dd-btn .dd-lab{overflow:hidden;text-overflow:ellipsis}
.dd-btn .dd-pre{color:var(--ink3);font-weight:400}
.dd-btn svg{width:16px;height:16px;color:var(--ink3);flex:none;transition:transform .18s}
.dd-btn:hover{border-color:var(--ink3)}
.dd.open .dd-btn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd.block,.dd.block .dd-btn{width:100%}
.dd.block .dd-btn{justify-content:space-between;border-radius:12px;height:42px}
.dd.flat .dd-btn{background:var(--surface2);border-color:transparent}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);padding:6px;z-index:30;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top;pointer-events:none;visibility:hidden;transition:opacity .16s ease,transform .18s cubic-bezier(.2,.8,.2,1),visibility 0s .2s;max-height:320px;overflow:auto;max-width:calc(100vw - 32px)}
.dd.right .dd-menu{left:auto;right:0}
.dd.open .dd-menu{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--ink)}
.dd-item > span:first-of-type{white-space:nowrap}
.dd-item:hover,.dd-item.focus{background:var(--surface2)}
.dd-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dd-item .dd-sub{color:var(--ink3);font-size:12px;margin-left:auto;padding-left:14px}
.dd-item .chk{width:16px;height:16px;flex:none;opacity:0}
.dd-item.on .chk{opacity:1}
.dd-head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:8px 12px 4px}
.dd-sep{height:1px;background:var(--line);margin:6px 4px}
/* header: category dropdown inside search */
.search > #qcatDD{display:flex;align-items:stretch;position:relative;z-index:1}
.search .dd{display:flex;align-self:stretch}
.search .dd .dd-btn{height:auto;align-self:stretch;border:0;border-radius:0;background:transparent;border-right:1px solid var(--line2);padding:0 10px 0 16px;color:var(--ink2);font-size:12.5px}
.search .dd.open .dd-btn{box-shadow:none;background:var(--surface2);border-radius:999px 0 0 999px}
.search .dd-menu{min-width:220px;top:calc(100% + 8px)}
/* search suggestions */
.sugwrap{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .16s ease,transform .18s cubic-bezier(.2,.8,.2,1)}
.sugwrap.open{opacity:1;transform:none;pointer-events:auto}
.search{position:relative;overflow:visible}
.search > input,.search > button{position:relative;z-index:1}
.search::before{content:"";position:absolute;inset:0;border-radius:999px;background:inherit;z-index:0}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow2);padding:8px;max-height:min(70vh,520px);overflow:auto}
.sug .dd-head{padding:8px 12px 4px}
.sug-item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--ink)}
.sug-item:hover,.sug-item.focus{background:var(--surface2)}
.sug-item .im{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--surface2)}
.sug-item .im{position:relative}
.sug-item .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.sug-item b{display:block;font-size:13.5px;font-weight:500;line-height:1.3}
.sug-item small{color:var(--ink3);font-size:12px}
.sug-item .pr{font-weight:700;font-size:13.5px;white-space:nowrap}
.sug mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.sug-line{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;color:var(--ink);font-size:13.5px}
.sug-line:hover{background:var(--surface2)}
.sug-line svg{width:16px;height:16px;color:var(--ink3)}
.sug-line .dd-sub{color:var(--ink3);font-size:12px;margin-left:auto}
.sug-empty{padding:14px 12px;color:var(--ink3);font-size:13px}
@media (max-width:560px){ .search .dd{display:none} .sug-item{grid-template-columns:40px 1fr} .sug-item .pr{grid-column:2;font-size:13px} }
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:0 18px;height:40px;font-weight:600;font-size:14px;border:1px solid transparent;text-decoration:none;white-space:nowrap;transition:filter .12s,background .12s}
.btn.pri{background:var(--cta);border-color:var(--cta-b);color:var(--cta-ink)}
.btn.pri:hover{filter:brightness(1.2)}
.btn.ora{background:var(--cta2);border-color:var(--cta2-b);color:#fff}
.btn.ora:hover{background:var(--cta2-b)}
.btn.sec{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn.sec:hover{background:var(--surface2)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;border-color:transparent;color:var(--link);padding-inline:10px}
.btn.lg{height:46px;padding-inline:24px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
/* ---------- hero ---------- */
.hero{padding-block:20px 0}
.banner{position:relative;border-radius:var(--r2);overflow:hidden;background:linear-gradient(110deg,#0b0f1a 0%,#151c2e 60%,#1e2a4a 100%);color:#fff;display:grid;grid-template-columns:1.1fr .9fr;min-height:340px}
.banner .txt{padding:44px 44px 40px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.banner .kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#93c5fd}
.banner h1{font-size:clamp(28px,3.6vw,44px);font-weight:800;letter-spacing:-.02em;max-width:18ch}
.banner p{font-size:16px;color:#c7d0dd;max-width:48ch}
.banner .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.banner .img{position:relative;min-height:240px}
.banner .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.banner .img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#151c2e 0%,rgba(21,28,46,0) 30%);z-index:1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:18px 20px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--ink)}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:15px;margin-bottom:2px}
.tile span{color:var(--ink2);font-size:13px}
/* ---------- catalog ---------- */
.catalog{display:grid;grid-template-columns:240px 1fr;gap:20px;padding-block:20px 40px}
.filters{position:sticky;top:120px;align-self:start;display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.fgroup h4{font-size:14px;margin-bottom:8px}
.fgroup label{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;color:var(--ink);font-size:14px}
.fgroup label:hover{color:var(--link)}
.fgroup input[type=checkbox],.fgroup input[type=radio]{accent-color:var(--accent);width:16px;height:16px;padding:0;margin:0}
.fgroup .n{margin-left:auto;color:var(--ink3);font-size:12.5px}
.ftoggle-wrap{display:none;grid-column:1/-1}
.ftoggle{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:0 14px;height:38px;font-weight:600}
.ftoggle .cnt{background:var(--accent);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:12px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.chead h2{font-size:20px}
.chead .cnt{color:var(--ink3);font-size:13px;margin-left:8px;font-weight:500}
.sort{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
.sort select{padding:7px 10px;border-radius:999px;background:var(--surface2);font-size:13px}
.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s;cursor:pointer;position:relative}
.card:hover{box-shadow:var(--shadow2);transform:translateY(-2px)}
.thumb{aspect-ratio:4/3;background:linear-gradient(145deg,var(--panel-g1),var(--panel-g2));display:grid;place-items:center;color:var(--panel-ink);position:relative}
.thumb svg{width:70%;height:70%}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#fff;padding:6%}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:4px;background:#0f1111;color:#fff;letter-spacing:.02em}
.badge.hit{background:#111827}
.badge.new{background:#2563eb}
.badge.sale{background:#dc2626}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.brand{font-size:12px;color:var(--ink3);font-weight:500}
.card h3{font-size:15px;font-weight:500;line-height:1.35;color:var(--ink)}
.card:hover h3{color:var(--accent)}
.rating{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.rating .rc{color:var(--link)}
.stars{display:inline-flex;gap:0;color:var(--star)}
.stars svg{width:15px;height:15px}
.stars .off{color:var(--line2)}
.sold{font-size:12.5px;color:var(--ink2)}
.sold b{font-weight:600;color:var(--ink)}
.price{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.price .now{font-weight:700;font-size:22px;letter-spacing:-.02em}
.price .old{color:var(--ink3);text-decoration:line-through;font-size:13px}
.price .usd{color:var(--ink3);font-size:12px}
.inst{font-size:12.5px;color:var(--ink2)}
.inst b{color:var(--ink);font-weight:600}
.deliv-line{font-size:12.5px;color:var(--ink2)}
.deliv-line b{color:var(--ink);font-weight:600}
.cfoot{display:flex;gap:8px;margin-top:8px}
.cfoot .btn{flex:1;height:36px;font-size:13.5px}
.empty{padding:60px 20px;text-align:center;color:var(--ink3);grid-column:1/-1;background:var(--surface);border-radius:var(--r2)}
/* ---------- how ---------- */
.how{padding-block:8px 40px}
.how .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:28px 28px 30px}
.how h2{font-size:22px}
.how .sub{color:var(--ink2);max-width:70ch;margin-top:6px;font-size:14.5px}
.how .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.how .col{background:var(--surface2);border-radius:var(--r2);padding:18px}
.how .col b{font-size:16px;display:block;margin-bottom:6px}
.how .col p{color:var(--ink2);font-size:13.5px}
.how .col s{color:var(--ink3);display:block;margin-top:10px;font-size:12.5px;text-decoration:none}
.how .col s::before{content:"В обычном магазине: ";color:var(--ink3)}
/* ---------- product page ---------- */
.pp{padding-block:14px 50px}
.crumbs{display:flex;gap:6px;color:var(--ink3);font-size:12.5px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.crumbs button{background:none;border:0;padding:0;color:var(--ink2);font-size:12.5px}
.crumbs button:hover{color:var(--accent);text-decoration:underline}
.pp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:20px}
.pp-top{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) 300px;gap:24px;align-items:start}

.buy{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r2);padding:18px;display:flex;flex-direction:column;gap:10px;position:sticky;top:120px}
.buy .bprice{font-weight:700;font-size:26px;letter-spacing:-.02em}

.stock{display:flex;align-items:center;gap:6px;font-size:16px;color:var(--good);font-weight:600}

.qty{display:flex;align-items:center;gap:8px;font-size:13px}

.buyrow{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.deliv{border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.deliv .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.deliv select{flex:1;min-width:120px;padding:7px 10px;font-size:13px}

.guar{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}
.guar span::before{content:"✓";color:var(--good);font-weight:800;margin-right:8px}
.expert{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:var(--r);padding:10px 12px;font-size:12.5px;flex-wrap:wrap}

.expert span{color:var(--ink2)}
.expert button{background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font-weight:600;font-size:12.5px;white-space:nowrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:24px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs button .n{color:var(--ink3);font-weight:500;margin-left:6px;font-size:12.5px}
.tabpane{padding-block:22px 6px}
.desc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:28px}

.desc .txt p strong{color:var(--ink);font-weight:600}
.side{display:flex;flex-direction:column;gap:12px}
.sidebox{background:var(--surface2);border-radius:var(--r2);padding:16px}
.sidebox h4{font-size:13px;margin-bottom:10px}

.sidebox .fit{display:flex;flex-direction:column;gap:8px}
.sidebox .fit div{display:flex;gap:8px;font-size:13.5px}
.sidebox .fit div::before{content:"✓";color:var(--good);font-weight:800}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.specs dl{margin:0}

.specs .row:nth-child(odd){background:var(--surface2)}
.specs dt{color:var(--ink2);font-weight:600}
.specs dd{margin:0}
.faq{display:flex;flex-direction:column;gap:8px;max-width:84ch}
.faq details{background:var(--surface2);border-radius:var(--r);padding:0 16px}
.faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--ink3);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq .a{padding-bottom:14px;color:var(--ink);line-height:1.6;font-size:13.5px}
.faq .a small{display:block;margin-top:6px;color:var(--ink3)}
.askbox{margin-top:16px;display:flex;gap:8px;max-width:84ch;flex-wrap:wrap}
.askbox input{min-width:0;flex:1 1 220px}
.askbox input{flex:1;border-radius:999px;padding:9px 14px}
.askbox .btn{height:40px}
.revs{display:grid;grid-template-columns:280px 1fr;gap:28px}

.rsum .stars svg{width:18px;height:18px}

.bars i b{display:block;height:100%;background:var(--star)}
.rec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.rec b{color:var(--ink);font-size:18px}
.rlist{display:flex;flex-direction:column;gap:14px}

.rev p{margin-top:4px;color:var(--ink);line-height:1.6;font-size:13.5px}
.rev .pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:13px}
.rev .pm div{background:var(--surface2);border-radius:6px;padding:8px 10px}

.rev .f{display:flex;gap:12px;margin-top:10px;font-size:12.5px;color:var(--ink3);align-items:center}
.rev .f button{background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink)}

.rev .exp{margin-top:8px;font-size:12.5px}

.related h2{font-size:18px;margin:26px 0 12px}
.related .grid-cards{grid-template-columns:repeat(4,1fr)}

.veil{position:fixed;inset:0;background:rgba(15,17,17,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}

.ci{display:grid;grid-template-columns:72px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px}

box:['Гитара Fender Player II Stratocaster','Рычаг тремоло','Ключ для анкера и шестигранники','Чехол Fender Deluxe Gig Bag','Сертификат проверки TONE'],
specs:[['Корпус','Ольха (Alder)'],['Гриф','Клён, профиль Modern C, болченый'],['Накладка','Палисандр, 22 лада Medium Jumbo, радиус 9.5"'],['Мензура','25.5" (648 мм)'],['Звукосниматели','3 × Player Series Alnico 5 Single-Coil'],['Электроника','5-позиционный переключатель, 1 громкость, 2 тона'],['Бридж','2-Point Synchronized Tremolo с блочным седлом'],['Колки','ClassicGear, литые'],['Ширина у порожка','42 мм (1.650")'],['Струны','Fender NPS 9–42'],['Вес','≈ 3.6 кг'],['Страна','Мексика'],['Гарантия','2 года официальной гарантии Fender + 14 дней на возврат']],
faq:[{q:'Чем Player II отличается от первой серии Player?',a:'Три главных изменения: вернулась палисандровая накладка (в Player была pau ferro), скруглены края накладки для комфорта, обновлены колки ClassicGear. Звукосниматели те же Alnico 5, но тремоло и седла доработаны для лучшей стабильности строя.',who:'Тимур, эксперт TONE'},{q:'Подойдёт ли для тяжёлой музыки?',a:'Для классического рока и хард-рока — да, бриджевый сингл достаточно плотный. Для метала с сильным перегрузом синглы могут фонить; посмотрите Player II HSS (с хамбакером у бриджа) — она есть у нас в каталоге.',who:'Тимур, эксперт TONE'},{q:'Нужно ли что-то докупать?',a:'Кабель и комбоусилитель, если их ещё нет. В комплекте уже есть чехол, рычаг и ключи. Хорошая пара — Boss Katana-50 Gen 3 из этого же каталога.',who:'Тимур, эксперт TONE'},{q:'Держит ли строй тремоло?',a:'При заводской настройке (три пружины, рычаг «плавающий» на 2 мм) держит уверенно при лёгком вибрато. Для агрессивных дайвов советуем прижать тремоло к деке — это делается за 5 минут, можем сделать перед отправкой бесплатно.',who:'Тимур, эксперт TONE'}],
reviews:[{n:'Азиз Р.',city:'Ташкент',date:'12 сентября 2026',r:5,t:'Лучшая покупка за год',p:'Играл на ученической Squier три года и всё думал, стоит ли переплачивать. Стоит. Гриф с закруглёнными краями — совсем другие ощущения, бенды делаются без усилий. Позиция 4 звучит как на записях, которые я разбираю. Пришла настроенная, в коробке с отметкой мастера.',plus:'Гриф, звук во 2 и 4 позиции, настройка из коробки',minus:'Чехол мягкий, для перелётов нужен кейс',exp:'Играю 4 года',help:38},{n:'Дилноза К.',city:'Самарканд',date:'28 августа 2026',r:5,t:'Подарок сыну, доставили за день',p:'Заказала в четверг вечером, в пятницу привезли в Самарканд. Сын в восторге, преподаватель в музыкальной школе сказал, что инструмент отличный и на нём можно играть годами. Помогли с выбором цвета в чате.',plus:'Скорость доставки, консультация',minus:'—',exp:'Покупала в подарок',help:21},{n:'Жасур М.',city:'Наманган',date:'3 августа 2026',r:4,t:'Хороший инструмент, но проверьте пружины',p:'Звук и сборка на уровне, ноль претензий к дереву и лакировке. Единственное — мне тремоло показалось слишком мягким, добавил четвёртую пружину. Магазин, кстати, предлагает это сделать бесплатно, я просто не заметил в описании.',plus:'Качество сборки, цена для Fender',minus:'Мягкая заводская настройка тремоло',exp:'Играю 10 лет, есть 6 гитар',help:17},{n:'Камила Т.',city:'Ташкент',date:'19 июля 2026',r:5,t:'Звук из демо совпал с реальностью',p:'Послушала демо на сайте, сравнила с Les Paul, поняла что хочу именно стеклянный стратовский тон. Так и оказалось. Спасибо за честное описание — «синглы фонят под перегрузом» это правда, но мне и не нужно.',plus:'Описание совпало с реальностью',minus:'Нет',exp:'Играю 2 года',help:12}]},
{id:'fg800', cat:'guitars', brand:'Yamaha', name:'FG800 акустическая гитара, Natural', usd:229, icon:'g-acoustic', badges:['hit'], rating:4.9, dist:[90,8,2,0,0], sold:1240, rec:98, stock:14,
colors:[{n:'Natural',c:'#d9a866'},{n:'Sand Burst',c:'#a3612c'},{n:'Black',c:'#1b1b1b'}],
short:'Самая продаваемая акустика в мире не просто так: массивная еловая дека, громкий ровный звук и цена, за которую другие дают фанеру.',
desc:['<h3>Первая гитара, которую не придётся менять</h3>','FG800 — наследница Yamaha FG180 1966 года, гитары, с которой начиналась «народная» акустика. Главное здесь — <strong>верхняя дека из массива ели</strong>. У большинства гитар в этой цене дека из фанеры, которая звучит одинаково и в первый день, и через десять лет. Массив «раскрывается»: чем больше играете, тем богаче звучит.','Yamaha применила здесь свою фирменную <strong>скаллопированную пружинную систему</strong> (scalloped bracing): дека тоньше и легче в нужных местах, отсюда громкий низ и чистые верха. Гитара звучит крупнее своей цены — это первое, что говорят покупатели, взяв её в руки.','Корпус дредноут — классическая форма для аккомпанемента и боя. Гриф из нато с палисандровой накладкой, удобный для начинающих: не слишком широкий, не слишком тонкий.','Перед отправкой мы снижаем высоту струн до комфортных 2.3 мм на 12-м ладу: заводская настройка бывает высоковата для новичков, и мы это исправляем.'],
fit:['Первая гитара для взрослого или подростка','Аккомпанемент под голос, бой и перебор','Кто хочет «взрослый» звук массива за деньги ученической гитары'],
box:['Гитара Yamaha FG800','Комплект запасных струн D\'Addario EJ16','Медиаторы (3 шт.)','Сертификат проверки TONE'],
specs:[['Форма корпуса','Дредноут (Traditional Western)'],['Верхняя дека','Массив ели (Solid Sitka Spruce)'],['Обечайка и нижняя дека','Нато / Окуме'],['Гриф','Нато'],['Накладка','Палисандр, 20 ладов'],['Мензура','634 мм (25")'],['Ширина у порожка','43 мм'],['Пружины','Scalloped X-bracing'],['Колки','Литые, хромированные'],['Отделка','Глянцевый лак'],['Струны','Бронзовые 12–53'],['Гарантия','1 год Yamaha + 14 дней возврат']],
faq:[{q:'Нужна ли она мне, если я вообще не умею играть?',a:'Да, это одна из лучших первых гитар. Она прощает ошибки: громкая, ровно строит по всему грифу, а массивная дека мотивирует — вы слышите, как звучите лучше с каждой неделей.',who:'Мадина, эксперт TONE'},{q:'FG800 или FG820 — в чём разница?',a:'У FG820 обечайка из махагони вместо нато и чуть теплее звук, дороже примерно на 20%. Для первого инструмента разницы почти не услышите; FG800 — более рациональный выбор.',who:'Мадина, эксперт TONE'},{q:'Можно ли поставить нейлоновые струны?',a:'Нет, это гитара под металлические струны, и анкер с пружинами рассчитаны на них. Если нужен нейлон — смотрите Cordoba C5 или Yamaha C40.',who:'Мадина, эксперт TONE'}],
reviews:[{n:'Бекзод С.',city:'Ташкент',date:'20 сентября 2026',r:5,t:'Звучит как гитара за втрое дороже',p:'Сравнивал в живую с гитарами за 500–600 долларов. Разница есть, но не втрое. Низ глубокий, бой громкий. Струны снизили перед отправкой, пальцы не болят как на прошлой гитаре.',plus:'Звук, низкие струны, цена',minus:'Глянец собирает отпечатки',exp:'Учусь 8 месяцев',help:54},{n:'Нигора А.',city:'Бухара',date:'1 сентября 2026',r:5,t:'Купила себе в 40 лет, не жалею',p:'Всегда хотела научиться. Консультант подобрал по руке, объяснил, почему не нужно брать самую дешёвую. Доставили в Бухару за два дня, коробка целая, гитара настроена.',plus:'Консультация без снобизма',minus:'—',exp:'Начинающая',help:30},{n:'Сардор У.',city:'Фергана',date:'11 августа 2026',r:5,t:'Преподаю, советую ученикам именно её',p:'У меня в классе уже шесть FG800. Ни одна не повела гриф за два года, все держат строй. Для ученика это идеальный баланс цены и качества.',plus:'Стабильность, звук',minus:'Нет чехла в комплекте у самой Yamaha',exp:'Преподаватель, 15 лет',help:47},{n:'Малика Ю.',city:'Андижан',date:'2 июля 2026',r:4,t:'Хорошо, но возьмите чехол',p:'Гитара отличная. Не хватило только чехла, пришлось докупать отдельно — рекомендую сразу добавить в корзину, мне доставили отдельным заказом.',plus:'Всё по звуку',minus:'Чехол отдельно',exp:'Играю 1 год',help:9}]},
{id:'lp60', cat:'guitars', brand:'Gibson', name:'Les Paul Standard \'60s, Unburst', usd:2799, icon:'g-lespaul', badges:[], rating:4.9, dist:[92,6,2,0,0], sold:37, rec:100, stock:2,
colors:[{n:'Unburst',c:'#d9a05a'},{n:'Iced Tea',c:'#b56a2a'},{n:'Bourbon Burst',c:'#7d3b16'}],
short:'Собранный в Нэшвилле Les Paul с махагоновым корпусом, кленовым топом AA и хамбакерами BurstBucker. Инструмент на всю жизнь.',
desc:['<h3>Голос рока с 1958 года</h3>','Les Paul Standard \'60s воспроизводит спецификации гитар конца 50-х — тех самых, которые сегодня стоят как квартира. <strong>Махагоновый корпус с кленовым топом</strong> класса AA даёт плотный, тягучий сустейн и ту «толщину» звука, которую невозможно получить от гитары с болченым грифом.','Хамбакеры <strong>BurstBucker 61R и 61T</strong> намотаны с намеренной асимметрией катушек, как оригинальные PAF. Отсюда «дыхание» звука: на чистом — тепло и объём, на перегрузе — тот самый рёв Джимми Пейджа и Слэша.','Гриф SlimTaper 60-х — тоньше, чем на \'50s версии, быстрый и привычный современному гитаристу. Вклеенный гриф, нитроцеллюлозный лак, который со временем стареет и делает гитару только красивее.','Каждый Les Paul мы отправляем в фирменном жёстком кейсе Gibson и страхуем на полную стоимость. Перед отправкой присылаем вам фото именно вашего экземпляра — рисунок топа у каждой гитары уникален.'],
fit:['Гитаристам, которые точно знают, что хотят Les Paul','Студийная работа, где нужен плотный сустейн','Тем, кто покупает один инструмент на десятилетия'],
box:['Gibson Les Paul Standard \'60s','Жёсткий кейс Gibson','Сертификат подлинности Gibson','Ключи, документы','Сертификат проверки TONE + фото вашего экземпляра'],
specs:[['Корпус','Махагони, топ клён AA'],['Гриф','Махагони, вклеенный, профиль SlimTaper 60s'],['Накладка','Палисандр, 22 лада, радиус 12"'],['Мензура','24.75" (628 мм)'],['Звукосниматели','BurstBucker 61R (гриф), BurstBucker 61T (бридж)'],['Электроника','2 громкости, 2 тона, 3-позиционный переключатель, Orange Drop конденсаторы'],['Бридж','ABR-1 Tune-O-Matic, алюминиевый стоп-бар'],['Колки','Grover Rotomatic'],['Порожек','Graph Tech'],['Отделка','Нитроцеллюлозный лак'],['Вес','≈ 4.1–4.4 кг'],['Страна','США, Нэшвилл'],['Гарантия','Пожизненная (Gibson, первый владелец) + 14 дней возврат']],
faq:[{q:'Почему такая разница в цене с Epiphone Les Paul?',a:'Epiphone — лицензионная копия, собранная в Китае, с другой древесиной, электроникой и лаком. Gibson — оригинал из Нэшвилла с нитролаком, BurstBucker и пожизненной гарантией. Звук Epiphone хорош для своих денег, но это разные инструменты по ощущениям и сустейну.',who:'Тимур, эксперт TONE'},{q:'Она тяжёлая?',a:'Да, 4.1–4.4 кг — это особенность Les Paul. Для двухчасового концерта берите широкий ремень. Взамен вы получаете сустейн, за который эту гитару и любят.',who:'Тимур, эксперт TONE'},{q:'Можно ли увидеть свою гитару до покупки?',a:'Да. После оформления заказа мы присылаем вам фото и видео конкретного экземпляра со склада, и вы подтверждаете отправку. Если рисунок топа не понравится — покажем другой.',who:'Тимур, эксперт TONE'}],
reviews:[{n:'Рустам Х.',city:'Ташкент',date:'5 сентября 2026',r:5,t:'Мечта с 16 лет, сбылась в 34',p:'Прислали фото трёх экземпляров, выбрал самый «полосатый» топ. Гитара приехала в кейсе, с сертификатом. Сустейн такой, что нота держится, пока не надоест. Спасибо за подход — это как в хорошем живом магазине, только не надо ехать.',plus:'Выбор экземпляра по фото, кейс, звук',minus:'Тяжёлая, но это Les Paul',exp:'Играю 18 лет',help:44},{n:'Отабек Н.',city:'Ташкент',date:'14 июля 2026',r:5,t:'Для студии — лучшее вложение',p:'Записываю в своей студии. С BurstBucker риффы садятся в микс без лишней эквализации. Настроена идеально, интонация по всему грифу точная.',plus:'Звук в записи',minus:'Нет',exp:'Звукорежиссёр',help:26}]},
{id:'c5', cat:'guitars', brand:'Cordoba', name:'C5 классическая гитара, кедровый массив', usd:379, icon:'g-classical', badges:[], rating:4.7, dist:[78,16,4,2,0], sold:286, rec:95, stock:9,
colors:[{n:'Natural Cedar',c:'#c9863f'}],
short:'Испанская конструкция, массив канадского кедра и тёплый, глубокий звук. Классика для музыкальной школы и домашней игры, без пластикового ощущения дешёвых гитар.',
desc:['<h3>Настоящий испанский звук за разумные деньги</h3>','Cordoba C5 сделана по традиционной испанской технологии: гриф и корпус собраны как единое целое («испанская пятка»), а верхняя дека — <strong>массив канадского кедра</strong>. Кедр даёт тёплый, обволакивающий тон с первой минуты, в отличие от ели, которой нужны годы, чтобы «разыграться».','Веерные пружины, лёгкий корпус, глянцевая полиуретановая отделка — гитара звучит открыто и громко, отзывается на лёгкое касание. Именно поэтому её советуют преподаватели: ученик слышит нюансы своей игры.','Гриф из махагони с палисандровой накладкой, стандартная классическая ширина 52 мм у порожка. Струны Savarez Cristal Corum — хорошие струны из коробки, а не то, что придётся сразу менять.'],
fit:['Ученикам музыкальной школы (взрослый размер 4/4)','Классика, фламенко, босса-нова, романсы','Тем, кому нужны мягкие нейлоновые струны для пальцев'],
box:['Гитара Cordoba C5','Чехол Cordoba Deluxe Gig Bag','Сертификат проверки TONE'],
specs:[['Размер','4/4'],['Верхняя дека','Массив канадского кедра'],['Обечайка и нижняя дека','Махагони'],['Гриф','Махагони'],['Накладка','Палисандр, 19 ладов'],['Мензура','650 мм'],['Ширина у порожка','52 мм'],['Пружины','Веерные (fan bracing)'],['Струны','Savarez Cristal Corum High Tension'],['Отделка','Глянец'],['Анкер','Есть, двусторонний'],['Гарантия','1 год + 14 дней возврат']],
faq:[{q:'Подойдёт ли для музыкальной школы?',a:'Да, это полный размер 4/4 для детей от 11–12 лет и взрослых. Для младших посмотрите Cordoba C1M 3/4 — можем привезти под заказ.',who:'Мадина, эксперт TONE'},{q:'Кедр или ель?',a:'Кедр (эта модель) — теплее и сразу «раскрыт», идеален для дома и обучения. Ель — ярче и громче, но требует времени. Для первой классики советуем кедр.',who:'Мадина, эксперт TONE'}],
reviews:[{n:'Гульнора Ф.',city:'Ташкент',date:'8 сентября 2026',r:5,t:'Дочь ходит в музыкалку, педагог одобрил',p:'Педагог сравнила с гитарами других учеников и сказала, что у нашей звук глубже и струны мягче. Ребёнку не больно играть. Чехол в комплекте удобный, с рюкзачными лямками.',plus:'Мягкие струны, звук, чехол',minus:'—',exp:'Родитель ученицы',help:33},{n:'Фаррух Д.',city:'Карши',date:'25 июля 2026',r:4,t:'Хорошая, чуть высоковаты струны',p:'Инструмент отличный, но струны на 12 ладу мне показались высоковаты. Написал в поддержку, объяснили, как подпилить косточку, или предложили сделать в сервисе бесплатно. Сделал сам.',plus:'Тон, поддержка',minus:'Высота струн под мои руки',exp:'Играю 6 лет',help:14}]},
{id:'p145', cat:'keys', brand:'Yamaha', name:'P-145 цифровое пианино, 88 клавиш, чёрное', usd:499, icon:'g-piano', badges:['hit'], rating:4.8, dist:[83,13,3,1,0], sold:864, rec:97, stock:11,
colors:[{n:'Black',c:'#1b1b1b'},{n:'White',c:'#f0ede4'}],
short:'88 взвешенных клавиш с молоточковой механикой GHC, звук концертного рояля Yamaha CFIIIS и корпус, который помещается на обычный стол.',
desc:['<h3>Настоящее пианино, которое не займёт полкомнаты</h3>','P-145 — самое компактное 88-клавишное пианино Yamaha: 29 см в глубину и 11 кг. При этом внутри <strong>молоточковая механика GHC</strong> (Graded Hammer Compact): басовые клавиши тяжелее, верхние легче, как на акустическом рояле. Именно это нужно ученику, чтобы потом пересесть за настоящий инструмент без переучивания рук.','Звук — сэмплы <strong>концертного рояля Yamaha CFIIIS</strong>, того, на котором играют в залах. 64-голосная полифония: педаль можно держать, играть арпеджио, и ноты не «обрываются». Плюс электропиано, орган, клавесин и струнные.','Встроенные динамики звучат чисто на домашней громкости, а для занятий ночью есть выход на наушники. Подключается к iPad по USB — приложение Smart Pianist показывает ноты и помогает разбирать пьесы.','Мы привозим и собираем: если возьмёте стойку L-100 и педальный блок LP-5A, получите полноценное «фортепиано» с тремя педалями — по цене намного ниже акустического.'],

specs:[['Клавиатура','88 клавиш, молоточковая GHC, матовые чёрные клавиши'],['Чувствительность','Hard / Medium / Soft / Fixed'],['Полифония','64 голоса'],['Тембры','10 (рояль CFIIIS, э-пиано, орган, клавесин и др.)'],['Динамики','2 × 7 Вт, 12 см'],['Подключения','USB to Host, наушники 6.3 мм, педаль'],['Метроном','Есть'],['Обучение','50 встроенных пьес, Smart Pianist'],['Размеры','1 326 × 129 × 268 мм'],['Вес','11.1 кг'],['Гарантия','1 год Yamaha + 14 дней возврат']],
faq:[{q:'Подходит ли для музыкальной школы?',a:'Да. Педагоги требуют 88 взвешенных клавиш с молоточковой механикой — здесь именно это. Для полного сходства с фортепиано советуем добавить педальный блок LP-5A.',who:'Шахноза, эксперт TONE'},{q:'P-145 или P-225?',a:'P-225 дороже примерно на 40%: механика GHC точно такая же, но лучше динамики, больше тембров и есть Bluetooth. Для ученика и дома P-145 достаточно; P-225 — если планируете выступать или записываться.',who:'Шахноза, эксперт TONE'},{q:'Можно играть в наушниках?',a:'Да, разъём 6.3 мм на задней панели, динамики при этом отключаются. Идеально для занятий вечером.',who:'Шахноза, эксперт TONE'},{q:'Нужна ли стойка?',a:'Не обязательно: пианино ставится на любой устойчивый стол высотой около 70–75 см. Стойка L-100 нужна, если хотите педальный блок с тремя педалями.',who:'Шахноза, эксперт TONE'}],
reviews:[{n:'Севара И.',city:'Ташкент',date:'17 сентября 2026',r:5,t:'Педагог сказала «берите», и была права',p:'Дочь в первом классе музыкалки. Механика тяжёлая, как в школе, пальцы ставятся правильно. Привезли за 3 часа, собрали на стойку, показали как подключить к планшету.',plus:'Механика, скорость доставки, сборка',minus:'Динамики не для большой комнаты',exp:'Родитель',help:61},{n:'Улугбек Т.',city:'Навои',date:'30 августа 2026',r:5,t:'Вернулся к музыке через 20 лет',p:'Компактное, стоит на столе в кабинете. Звук рояля очень естественный, особенно в наушниках. Занимаюсь по вечерам, никто не жалуется.',plus:'Компактность, звук в наушниках',minus:'—',exp:'Играл в детстве',help:27},{n:'Диёр К.',city:'Самарканд',date:'22 июля 2026',r:4,t:'Отлично, но хочется Bluetooth',p:'К самому пианино вопросов ноль. Единственное, к планшету только по проводу. Если нужен Bluetooth — есть версия P-145BT, консультант предлагал.',plus:'Всё по звуку и клавишам',minus:'Нет Bluetooth в базовой версии',exp:'Любитель',help:15}]},
{id:'fp30x', cat:'keys', brand:'Roland', name:'FP-30X цифровое пианино, 88 клавиш, чёрное', usd:749, icon:'g-piano', badges:['new'], rating:4.8, dist:[85,11,3,1,0], sold:301, rec:96, stock:5,

short:'Клавиатура PHA-4 Standard с эскейпментом и покрытием «слоновая кость», звуковой движок SuperNATURAL, Bluetooth-аудио и MIDI. Выбор тех, кто играет много.',
desc:['<h3>Когда важны нюансы касания</h3>','FP-30X — пианино для тех, кто уже играет и чувствует разницу. Клавиатура <strong>PHA-4 Standard</strong> с эскейпментом: тот самый лёгкий «щелчок» в нижней точке хода, как на рояле, и покрытие Ivory Feel, на котором пальцы не скользят.','Движок <strong>SuperNATURAL Piano</strong> не проигрывает сэмплы, а моделирует поведение струн и резонанс — 256 голосов полифонии, ноты не обрываются даже в самых плотных пассажах. Динамики 2 × 11 Вт звучат заметно крупнее, чем у конкурентов в этом классе.','Bluetooth-аудио и MIDI: включаете минусовку с телефона через динамики пианино или пишете партии в GarageBand без проводов. Приложение Roland Piano App для занятий и настроек.'],

specs:[['Клавиатура','88 клавиш, PHA-4 Standard, эскейпмент, Ivory Feel'],['Звуковой движок','SuperNATURAL Piano'],['Полифония','256 голосов'],['Тембры','56'],['Динамики','2 × 11 Вт'],['Bluetooth','Аудио 3.0 + MIDI 4.0'],['Подключения','USB Computer, USB Memory, 2 × наушники, Line Out L/R, педаль'],['Размеры','1 300 × 150 × 284 мм'],['Вес','14.8 кг'],['Гарантия','2 года Roland + 14 дней возврат']],
faq:[{q:'В чём разница с Yamaha P-145 за $499?',a:'Здесь более продвинутая клавиатура с эскейпментом, в 4 раза больше полифония, вдвое мощнее динамики и Bluetooth. Если играете больше часа в день и уже умеете — разницу почувствуете сразу. Для первого года обучения достаточно P-145.',who:'Шахноза, эксперт TONE'},{q:'Два выхода на наушники — зачем?',a:'Для занятий с педагогом или родителем: оба слышат игру, а соседи — нет.',who:'Шахноза, эксперт TONE'}],
reviews:[{n:'Лола Б.',city:'Ташкент',date:'9 сентября 2026',r:5,t:'Студентка консерватории, довольна',p:'Занимаюсь дома по 3 часа. Клавиатура очень близка к акустике, эскейпмент есть, репетиция нот быстрая. По Bluetooth играю с минусовками.',plus:'Клавиатура, полифония, Bluetooth',minus:'Тяжёлое, 15 кг',exp:'Консерватория',help:29},{n:'Анвар С.',city:'Джизак',date:'2 августа 2026',r:5,t:'Заменил старое акустическое пианино',p:'Старое пианино расстраивалось каждые полгода. Это — включил и играешь, звук рояля в наушниках лучше, чем было вживую у старого. Доставили в Джизак за 2 дня.',plus:'Звук, не требует настройки',minus:'—',exp:'Играю 25 лет',help:18}]},
{id:'td07', cat:'drums', brand:'Roland', name:'TD-07KV V-Drums электронная ударная установка', usd:999, icon:'g-drums', badges:['hit'], rating:4.7, dist:[76,18,4,1,1], sold:158, rec:94, stock:4,

short:'Сетчатые пэды на всех барабанах, модуль с 25 наборами и Bluetooth. Барабаны, на которых можно заниматься в квартире, не ссорясь с соседями.',
desc:['<h3>Настоящая игра, тихая для соседей</h3>','TD-07KV — установка, которую Roland сделал для одной задачи: чтобы вы могли заниматься дома каждый день. <strong>Двухслойные сетчатые пэды</strong> на малом и всех томах: отскок как у настоящих барабанов, а звук удара — тихий шорох. Натяжение регулируется ключом, как на акустике.','Модуль TD-07 даёт <strong>25 готовых наборов</strong> — от рок-установки до джазовых и электронных — плюс 143 инструмента для сборки своих. Тарелки с зонами чок и колокол, хай-хэт с педалью и полуоткрытым положением.','Bluetooth-аудио: включаете любимый трек с телефона в наушники и играете вместе с ним. USB-MIDI — пишете партии в DAW. Встроенный тренер (Coach) и 40 уроков Melodics в подарок.','Собираем и настраиваем при доставке в Ташкенте бесплатно. В регионы отправляем в заводской коробке с инструкцией и видеоуроком по сборке от нашего мастера.'],
fit:['Занятия дома в квартире','Начинающим и продолжающим барабанщикам','Домашняя студия: запись MIDI-партий'],
box:['Модуль TD-07','Малый барабан PDX-8 (сетка), 3 тома PDX-6 (сетка)','Крэш CY-8, райд CY-8, хай-хэт CY-5 с контроллером FD-1','Пэд бас-барабана KD-10','Стойка, кабели, ключ','Сертификат проверки TONE'],
specs:[['Модуль','TD-07, 25 наборов, 143 инструмента'],['Малый','PDX-8, 8", двухслойная сетка, 2 зоны'],['Томы','3 × PDX-6, 6", сетка'],['Тарелки','Crash CY-8, Ride CY-8 (2 зоны, чок), Hi-Hat CY-5'],['Бас-барабан','Пэд KD-10, педаль в комплект не входит'],['Bluetooth','Аудио + MIDI'],['Подключения','USB, MIX IN, наушники, выход'],['Тренер','Coach, 40 уроков Melodics'],['Размеры в сборе','≈ 1 200 × 1 100 × 1 250 мм'],['Вес','≈ 21 кг'],['Гарантия','2 года Roland + 14 дней возврат']],
faq:[{q:'Насколько это тихо?',a:'Сетчатые пэды дают около 60 дБ — как разговор. Громче всего педаль бас-барабана по полу; советуем коврик или платформу, есть в каталоге.',who:'Бобур, эксперт TONE'},{q:'Педаль бас-барабана в комплекте?',a:'Нет, как и у всех установок Roland в этом классе. Подойдёт любая стандартная педаль; чаще всего берут Tama HP200P или Roland RDH-100 — добавим в заказ.',who:'Бобур, эксперт TONE'},{q:'Сколько места нужно?',a:'Примерно 1.2 × 1.1 м плюс место для стула. Помещается в углу комнаты.',who:'Бобур, эксперт TONE'}],
reviews:[{n:'Шерзод Т.',city:'Ташкент',date:'15 сентября 2026',r:5,t:'Соседи не знают, что я барабанщик',p:'Полгода занимаюсь каждый вечер. Сетка ощущается очень близко к настоящему малому. Мастер собрал за 40 минут и настроил чувствительность под меня.',plus:'Тишина, отскок, сборка мастером',minus:'Педаль пришлось докупить',exp:'Играю 6 месяцев',help:35},{n:'Марьям Р.',city:'Ташкент',date:'4 августа 2026',r:4,t:'Сын счастлив, педаль отдельно',p:'Купили ребёнку 12 лет. Играет по урокам Melodics. Из минусов — не ожидала, что педаль не входит, но консультант предупредил заранее и добавили в заказ.',plus:'Уроки, Bluetooth с телефоном',minus:'Педаль не в комплекте',exp:'Родитель',help:12},{n:'Азамат Ж.',city:'Самарканд',date:'19 июня 2026',r:5,t:'Собрал сам по видео за час',p:'В регион пришла в коробке, видео по сборке понятное. Модуль звучит хорошо в наушниках, для записи через USB более чем.',plus:'Видеоинструкция, звук',minus:'—',exp:'Играю 3 года',help:9}]},
{id:'cajon', cat:'drums', brand:'Meinl', name:'Headliner HCAJ1NT кахон, Natural', usd:149, icon:'g-cajon', badges:[], rating:4.6, dist:[70,22,6,2,0], sold:522, rec:93, stock:20,
colors:[{n:'Natural',c:'#d2a466'},{n:'Walnut',c:'#6b3e26'}],
short:'Ударная установка, которая помещается под мышкой. Бас, снейр и хай-хэт одной коробкой — для акустических концертов, репетиций и кофеен.',
desc:['<h3>Барабаны, которые вы носите с собой</h3>','Кахон — перуанский ящик, на котором сидят и играют руками. У Meinl Headliner <strong>передняя панель из балтийской берёзы</strong> и внутренние струны-снейр: верх панели даёт сухой щелчок малого барабана, центр — глубокий бас.','Корпус из MDF на резиновых ножках не гуляет по полу. Отверстие сзади направлено на микрофон или стену — звук полнее, чем кажется от коробки такого размера.','Идеален для акустического состава: гитара плюс кахон — уже группа. Вместе с гитарой FG800 это самый частый заказ у нас.'],

faq:[{q:'Нужно ли учиться?',a:'Базовый ритм осваивается за вечер: край — снейр, центр — бас. У нас есть бесплатный видеоурок на 20 минут, ссылка приходит с заказом.',who:'Бобур, эксперт TONE'}],
reviews:[{n:'Тимур А.',city:'Ташкент',date:'6 сентября 2026',r:5,t:'Играем в кофейне по выходным',p:'Купил к гитаре друга. Снейр звонкий, бас неожиданно глубокий. Возим в такси без чехла, ничего не отвалилось.',plus:'Звук, компактность',minus:'Чехол отдельно',exp:'Любитель',help:11},{n:'Зарина М.',city:'Ургенч',date:'12 августа 2026',r:4,t:'Хороший, но снейр пришлось отрегулировать',p:'Из коробки снейр был слишком дребезжащий. По инструкции подтянула за 5 минут. Дальше без претензий.',plus:'Цена, регулировка',minus:'Заводская настройка снейра',exp:'Начинающая',help:6}]},
{id:'yas280', cat:'wind', brand:'Yamaha', name:'YAS-280 альт-саксофон, золотой лак', usd:1599, icon:'g-sax', badges:[], rating:4.9, dist:[91,7,2,0,0], sold:94, rec:99, stock:3,
colors:[{n:'Gold Lacquer',c:'#d4a63a'}],
short:'Ученический саксофон, на котором не стыдно выйти на сцену. Точная механика Yamaha, лёгкий отклик и интонация, которую хвалят преподаватели по всему миру.',
desc:['<h3>Самый рекомендуемый первый саксофон</h3>','YAS-280 — саксофон, который преподаватели советуют чаще любого другого. Причина простая: у него <strong>точный строй по всему диапазону</strong>, а лёгкая механика прощает неуверенные пальцы ученика. Ребёнок или взрослый берёт первую ноту в первый же день.','Yamaha перенесла сюда решения из профессиональных моделей: улучшенный <strong>изгиб эски</strong> для лёгкого отклика, клапан переднего F, регулируемый упор для большого пальца. Корпус из латуни с золотым лаком, который держит вид годами.','Каждый саксофон мы проверяем на герметичность клапанов перед отправкой — это главная проблема инструментов «с полки», и мы её снимаем.'],
fit:['Ученикам музыкальной школы и колледжа','Взрослым, начинающим с нуля','Джаз, эстрада, духовой оркестр'],
box:['Саксофон YAS-280','Мундштук Yamaha 4C, лигатура, колпачок','Кейс-рюкзак','Ремень, смазка, тряпочка','Сертификат проверки TONE'],
specs:[['Строй','Es (альт)'],['Корпус','Латунь, золотой лак'],['Клапаны','Передний F, высокий F#'],['Резонаторы','Пластиковые'],['Мундштук','Yamaha 4C'],['Кейс','Лёгкий кейс-рюкзак'],['Вес','2.5 кг (инструмент)'],['Страна','Индонезия (сборка Yamaha)'],['Гарантия','1 год Yamaha + 14 дней возврат']],
faq:[{q:'С какого возраста можно?',a:'Обычно с 9–10 лет — зависит от размера рук и объёма лёгких. Для младших есть альт-саксофоны с укороченной механикой, привезём под заказ.',who:'Джамшид, эксперт TONE'},{q:'Трости в комплекте?',a:'Одна трость в комплекте. Советуем сразу взять коробку Rico Royal 2.0 или Vandoren 2.0 — трости расходуются.',who:'Джамшид, эксперт TONE'}],
reviews:[{n:'Фируза Э.',city:'Ташкент',date:'11 сентября 2026',r:5,t:'Педагог в колледже сказал: «идеально»',p:'Сын учится в колледже искусств. Педагог проверил клапаны, строй, сказал что такой инструмент можно и на конкурс. Приехал в кейсе, с ремнём и всем нужным.',plus:'Строй, комплект, лёгкость',minus:'—',exp:'Родитель студента',help:23},{n:'Камол Ш.',city:'Термез',date:'3 августа 2026',r:5,t:'Начал в 45 лет',p:'Смотрел обзоры месяц, взял именно этот. Первые ноты дались в тот же вечер. Доставили в Термез за три дня, коробка в коробке, всё цело.',plus:'Лёгкий отклик, упаковка',minus:'Нет',exp:'Начинающий',help:17}]},

/* ---------- helpers ---------- */
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const priceUzs = usd => Math.round(usd*RATE/10000)*10000;
const sum = usd => fmt(priceUzs(usd))+' сум';
const inst = usd => fmt(Math.round(priceUzs(usd)/12/1000)*1000)+' сум';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stars(r,cls=''){let h=`<span class="stars ${cls}" aria-label="${r} из 5">`;for(let i=1;i<=5;i++)h+=`<svg class="${i<=Math.round(r)?'':'off'}"><use href="#i-star"/></svg>`;return h+'</span>';}
const badgeName={hit:'Хит продаж',new:'Новинка',sale:'Скидка'};
const rc = p => p.reviews.length + Math.round(p.sold*0.22);
function icon(id){return `<svg><use href="#${id}"/></svg>`;}
function pic(p,i=0,alt=''){const a=(typeof IMG!=='undefined'&&IMG[p.id])||[];return icon(p.icon)+(a[i]?`<img src="${a[i]}" alt="${esc(alt||p.brand+' '+p.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'');}
function picCount(p){return ((typeof IMG!=='undefined'&&IMG[p.id])||[]).length;}
/* ---------- custom dropdown component ---------- */
const DD={};
function dd(id,items,value,onPick,o={}){
DD[id]={items,onPick};
const cur=items.find(i=>i.v===value)||items[0];
return `<div class="dd ${o.cls||''}" id="dd-${id}"><button type="button" class="dd-btn" onclick="ddToggle('${id}',event)" aria-haspopup="listbox" aria-expanded="false">${o.pre?`<span class="dd-pre">${o.pre}</span>`:''}<span class="dd-lab">${cur?cur.l:''}</span><svg><use href="#i-chev"/></svg></button>
<div class="dd-menu" role="listbox">${items.map(i=>i.head?`<div class="dd-head">${i.head}</div>`:i.sep?`<div class="dd-sep"></div>`:`<button type="button" class="dd-item ${i.v===value?'on':''}" role="option" onclick="ddPick('${id}','${String(i.v).replace(/'/g,"\\'")}')"><svg class="chk"><use href="#i-check"/></svg><span>${i.l}</span>${i.sub?`<span class="dd-sub">${i.sub}</span>`:''}</button>`).join('')}</div></div>`;
}
function ddToggle(id,e){e.stopPropagation();const el=document.getElementById('dd-'+id);const open=el.classList.contains('open');document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'));closeSug();if(!open){el.classList.add('open');el.querySelector('.dd-btn').setAttribute('aria-expanded','true');}}
function ddPick(id,v){const d=DD[id];const it=d.items.find(i=>String(i.v)===v);document.getElementById('dd-'+id)?.classList.remove('open');d.onPick(it?it.v:v,it);}
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'));if(!e.target.closest('.search'))closeSug();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'));closeSug();}});
/* ---------- header category dropdown ---------- */
function renderQcat(){
const el=document.getElementById('qcatDD'); if(!el) return;
const cur=state.cat.size===1?[...state.cat][0]:'';
el.innerHTML=dd('qcat',[{v:'',l:'Все категории'},...Object.entries(CATS).map(([k,n])=>({v:k,l:n,sub:P.filter(p=>p.cat===k).length}))],cur,v=>{state.cat=v?new Set([v]):new Set();go('catalog');});
}
/* ---------- search suggestions ---------- */
let sugIdx=-1;
function hl(s,q){if(!q)return esc(s);const i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
function onSuggest(v){
const q=v.trim().toLowerCase(); const box=document.getElementById('sug'); if(!box) return; sugIdx=-1;
document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'));
let prods,brands,cats,title;
if(!q){prods=[...P].sort((a,b)=>b.sold-a.sold).slice(0,5);brands=[];cats=[];title='Популярное сейчас';}
else{prods=P.filter(p=>(p.brand+' '+p.name+' '+CATS[p.cat]+' '+p.short).toLowerCase().includes(q)).slice(0,6);
brands=[...new Set(P.map(p=>p.brand))].filter(b=>b.toLowerCase().includes(q));

const items=[...box.querySelectorAll('.sug-item,.sug-line')]; if(!items.length) return;
if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sugIdx=(sugIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((it,i)=>it.classList.toggle('focus',i===sugIdx));items[sugIdx].scrollIntoView({block:'nearest'});}
else if(e.key==='Enter'&&sugIdx>=0){e.preventDefault();items[sugIdx].click();}
}

if(actx.state==='suspended') actx.resume();
const t0=actx.currentTime+0.05; const master=actx.createGain(); master.gain.value=0.5; master.connect(actx.destination);
const note=(f,t,dur,type,gain,lp)=>{const o=actx.createOscillator();const g=actx.createGain();o.type=type;o.frequency.value=f;let n=o;if(lp){const fl=actx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl;}n.connect(g);g.connect(master);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);};
const hit=(t,dur,lp,gain)=>{const b=actx.createBuffer(1,actx.sampleRate*dur,actx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=actx.createBufferSource();s.buffer=b;const fl=actx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;const g=actx.createGain();g.gain.value=gain;s.connect(fl);fl.connect(g);g.connect(master);s.start(t);};
const kick=t=>{const o=actx.createOscillator();const g=actx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.15);g.gain.setValueAtTime(0.9,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.35);};
let len=2.6;
const E=82.41, A=110, D=146.83, G=196, B=246.94, e=329.63, C4=261.63, E4=329.63, G4=392, C5=523.25;
if(p.cat==='drums'){len=2.4;for(let i=0;i<8;i++){const t=t0+i*0.3;if(i%2===0)kick(t);else hit(t,0.18,4000,0.6);hit(t,0.06,9000,0.2);hit(t+0.15,0.06,9000,0.15);}}
else if(p.cat==='keys'){[[C4,0],[E4,0],[G4,0],[C5,0],[G4,0.6],[E4,1.2],[C4,1.8]].forEach(([f,d])=>{note(f,t0+d,1.6,'triangle',0.35);note(f*2,t0+d,0.8,'sine',0.12);});len=3.4;}
else if(p.cat==='wind'){[[G4,0,0.55],[C5,0.6,0.55],[E4*2,1.2,1.2]].forEach(([f,d,l])=>{note(f,t0+d,l,'sawtooth',0.28,1800);note(f*1.005,t0+d,l,'sawtooth',0.12,1200);});len=2.6;}
else if(p.cat==='studio'&&p.id==='sm58'){[[C4,0],[E4,0.2],[G4,0.4],[C5,0.6]].forEach(([f,d])=>note(f,t0+d,0.5,'sine',0.35,3000));len=1.4;}
else{ // guitar-like plucked arpeggio
const seq=p.id==='pbass'?[[E,0],[E,0.3],[G,0.6],[A,0.9],[E,1.2],[E,1.5],[D,1.8],[E,2.1]]:[[E,0],[B,0.18],[e,0.36],[G*2,0.54],[B*2,0.72],[e*2,0.9],[B*2,1.2],[G*2,1.4],[e,1.6],[B,1.8],[E,2.0]];
const dist=p.id==='lp60'||p.id==='katana';
seq.forEach(([f,d])=>{note(f,t0+d,dist?1.4:1.1,dist?'sawtooth':'triangle',dist?0.22:0.4,dist?2200:4000);note(f*2,t0+d,0.6,'sine',0.1);});
if(p.id==='uke'){len=2.2;}
}
playing=true; const b=document.getElementById('playBtn'); if(b) b.classList.add('playing');
setTimeout(()=>{playing=false;const b=document.getElementById('playBtn');if(b)b.classList.remove('playing');},len*1000);
toast('Играет демо: '+p.brand+' '+p.name.split(',')[0]);
}
/* ---------- cart ---------- */
function add(id,q){state.cart[id]=(state.cart[id]||0)+(q||1);saveCart();render();const p=P.find(x=>x.id===id);toast(p.brand+' '+p.name.split(',')[0]+' — в корзине',()=>openCart(),'Открыть');}
function setQty(id,d){state.cart[id]=(state.cart[id]||0)+d;if(state.cart[id]<=0)delete state.cart[id];saveCart();render();openCart();}
function cartTotal(){return Object.entries(state.cart).reduce((a,[id,q])=>a+priceUzs(P.find(p=>p.id===id).usd)*q,0);}
function openCart(){
state.done=null; renderCart();
}
function renderCart(){
const items=Object.entries(state.cart).map(([id,q])=>({p:P.find(x=>x.id===id),q}));
const total=cartTotal(); const ship=total>=1000000||total===0?0:25000;
let body;
if(state.done){body=`<div class="done"><div class="ok">✓</div><h3>Заказ № ${state.done} принят</h3><p>Мы позвоним за час до доставки. Инструмент проверит и настроит мастер перед отправкой. Ссылка для отслеживания придёт в SMS.</p><button class="btn pri" onclick="closeCart()">Вернуться в магазин</button></div>`;}
else if(!items.length){body=`<div class="done"><h3>Корзина пуста</h3><p>Начните с самой популярной гитары или с того, о чём мечтали давно.</p><button class="btn pri" onclick="closeCart();go('catalog')">В каталог</button></div>`;}
else if(state.checkout){body=`<form class="form" onsubmit="placeOrder(event)">
<label>Имя<input id="o-name" required placeholder="Как к вам обращаться"></label>
<label>Телефон<input id="o-phone" required type="tel" placeholder="+998 __ ___ __ __"></label>
<div class="two"><label>Город${dd('ocity',CITIES.map(c=>({v:c[0],l:c[0]})),state.city,v=>{state.city=v;renderCart()},{cls:'block'})}</label><label>Адрес<input id="o-addr" required placeholder="Улица, дом, квартира"></label></div>
<div class="eyebrow" style="margin-top:6px">Оплата</div>
<div class="pay"><label><input type="radio" name="pay" id="pay-click" checked>Click</label><label><input type="radio" name="pay" id="pay-payme">Payme</label><label><input type="radio" name="pay" id="pay-card">Картой онлайн</label><label><input type="radio" name="pay" id="pay-cash">При получении</label></div>
<label><span style="display:flex;gap:8px;align-items:center;flex-direction:row"><input type="checkbox" id="o-inst" style="width:16px;height:16px;padding:0;accent-color:var(--accent)">Оформить в рассрочку 0% на 12 месяцев</span></label>
<button class="btn pri lg" style="margin-top:6px">Подтвердить заказ · ${fmt(total+ship)} сум</button>
<button type="button" class="btn ghost" onclick="state.checkout=false;renderCart()">← Назад в корзину</button></form>`;}
else{body=items.map(({p,q})=>`<div class="ci"><div class="t">${pic(p)}</div><div><b>${p.brand} ${esc(p.name)}</b><span style="font-size:12.5px;color:var(--ink3)">${CATS[p.cat]}</span>
<div class="q"><button onclick="setQty('${p.id}',-1)">−</button><span class="num">${q}</span><button onclick="setQty('${p.id}',1)">+</button><span class="p num">${fmt(priceUzs(p.usd)*q)} сум</span></div>
<button class="rm" onclick="setQty('${p.id}',-${q})">Убрать</button></div></div>`).join('');}
const foot=(!state.done&&items.length&&!state.checkout)?`<div class="tot"><span>Товары (${items.reduce((a,i)=>a+i.q,0)})</span><span class="num">${fmt(total)} сум</span></div><div class="tot"><span>Доставка</span><span class="num">${ship?fmt(ship)+' сум':'бесплатно'}</span></div><div class="tot big"><span>Итого</span><span class="num">${fmt(total+ship)} сум</span></div><div class="tot"><span>В рассрочку</span><span class="num">${fmt(Math.round((total+ship)/12/1000)*1000)} сум × 12</span></div><button class="btn pri lg" onclick="state.checkout=true;renderCart()">Оформить заказ</button>`:'';
document.getElementById('overlay').innerHTML=`<div class="veil" onclick="closeCart()"></div><aside class="drawer" role="dialog" aria-label="Корзина"><div class="dh"><h3>Корзина</h3><button class="x" onclick="closeCart()" aria-label="Закрыть">×</button></div><div class="db">${body}</div>${foot?`<div class="df">${foot}</div>`:''}</aside>`;
}
function closeCart(){document.getElementById('overlay').innerHTML='';state.checkout=false;state.done=null;}
function placeOrder(e){e.preventDefault();state.done='TN-'+String(Math.floor(100000+Math.random()*900000));state.cart={};saveCart();state.checkout=false;render();renderCart();}
/* ---------- static pages ---------- */
function deliveryPage(){return `<section class="wrap page"><div class="box"><h1>Доставка и оплата</h1>
<p>Доставляем по всему Узбекистану. В Ташкенте — собственные курьеры, в регионы — проверенные партнёры с двойной упаковкой для инструментов. Любой инструмент перед отправкой проверяет и настраивает мастер, сертификат проверки лежит в коробке.</p>
<h3>Сроки и стоимость</h3><table><tr><th>Город</th><th>Срок</th><th>Стоимость</th></tr>${CITIES.map(c=>`<tr><td>${c[0]}</td><td>${c[2]}</td><td class="num">${c[1]===0?'бесплатно':fmt(c[1]*25000)+' сум, бесплатно от 1 000 000 сум'}</td></tr>`).join('')}</table>
<h3>Оплата</h3><p>Click, Payme, банковская карта онлайн или наличными и картой при получении. Рассрочка 0% на 12 месяцев на все инструменты дороже 1 000 000 сум — оформляется за 3 минуты при заказе.</p>
<h3>Возврат</h3><p>14 дней на возврат без объяснения причин, если инструмент не имеет следов использования. В Ташкенте забираем сами, из регионов — за наш счёт.</p></div></section>`;}
function aboutPage(){return `<section class="wrap page"><div class="box"><h1>О магазине TONE</h1>
<p>Мы открыли TONE, потому что сами устали покупать инструменты вслепую. В обычном магазине продавец занят, экземпляр на витрине один, а послушать можно тридцать секунд через чужой комбик. Онлайн было ещё хуже: три фото и характеристики, скопированные с сайта производителя.</p>
<p>Здесь каждая карточка собрана так, чтобы вы узнали об инструменте больше, чем узнали бы в зале: фото с каждой стороны, демо звука, полные характеристики, ответы мастеров на реальные вопросы покупателей и честные отзывы — включая отрицательные, которые мы не удаляем.</p>
<h3>Кто мы</h3><p>Команда из шести музыкантов и двух мастеров по ремонту. Официальные дилеры Fender, Gibson, Yamaha, Roland, Boss, Shure, Cordoba, Kala и Meinl. Шоурум в Ташкенте на Шота Руставели, 41 — приходите поиграть, если вы рядом. Если нет — мы привезём.</p>
<h3>Наши эксперты</h3><p>Тимур — гитары и усилители, 18 лет на сцене. Мадина — акустика и классика, преподаватель. Шахноза — клавишные, выпускница консерватории. Бобур — ударные и звук, звукорежиссёр. Джамшид — духовые, солист оркестра. Каждый отвечает в чате ежедневно с 9:00 до 21:00.</p></div></section>`;}
/* ---------- misc ---------- */
let toastT;
function toast(msg,act,label){const t=document.getElementById('toast');t.innerHTML=`<div class="toast">${esc(msg)}${act?`<button id="toastAct">${label}</button>`:''}</div>`;if(act)document.getElementById('toastAct').onclick=()=>{act();t.innerHTML='';};clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',3200);}
function toggleTheme(){const r=document.documentElement;const dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',dark?'light':'dark');try{localStorage.setItem('tone-theme',dark?'light':'dark');}catch(e){}}
try{const th=localStorage.getItem('tone-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCart();});
render();
</script>
</body></html>
